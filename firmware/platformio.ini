[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
  -<*>
  +<main.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -D API_BASE_URL=\"http://host.wokwi.internal:8765\"
  -D WIFI_SSID=\"Wokwi-GUEST\"
  -D WIFI_PASSWORD=\"\"

[env:esp32dev_physical]
extends = env:esp32dev
upload_speed = 115200
build_flags =
  -D USE_LOCAL_WIFI

[env:motor_bench]
extends = env:esp32dev
build_src_filter =
  -<*>
  +<motor_bench.cpp>
